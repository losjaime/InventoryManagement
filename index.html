<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div>
        <h1>Inventory Management</h1>
        <p>Track, manage, and monitor your stock</p>
      </div>
      <button id="toggle-form-btn" onclick="toggleForm()">+ Add Item</button>
    </div>
  </header>

  <main>

    <!-- Stats Cards -->
    <div class="stats">
      <div class="card">
        <p class="card-label">Total Items</p>
        <p class="card-amount" id="total-items">0</p>
      </div>
      <div class="card">
        <p class="card-label">Total Value</p>
        <p class="card-amount" id="total-value">$0.00</p>
      </div>
      <div class="card">
        <p class="card-label">Low Stock</p>
        <p class="card-amount low" id="low-stock">0</p>
      </div>
      <div class="card">
        <p class="card-label">Categories</p>
        <p class="card-amount" id="total-categories">0</p>
      </div>
    </div>

    <!-- Add / Edit Item Form -->
    <form id="item-form" class="form hidden" onsubmit="submitForm(event)">
      <h2 id="form-title">Add New Item</h2>
      <input type="hidden" id="edit-id" />
      <div class="form-grid">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="item-name" placeholder="e.g. Wireless Mouse" required />
        </div>
        <div class="form-group">
          <label>SKU</label>
          <input type="text" id="item-sku" placeholder="e.g. WM-001" required />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="item-category">
            <option>Electronics</option>
            <option>Office Supplies</option>
            <option>Furniture</option>
            <option>Tools</option>
            <option>Clothing</option>
            <option>Food & Beverage</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" id="item-quantity" placeholder="0" min="0" required />
        </div>
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" id="item-price" placeholder="0.00" min="0" step="0.01" required />
        </div>
        <div class="form-group">
          <label>Low Stock Threshold</label>
          <input type="number" id="item-threshold" placeholder="10" min="0" value="10" required />
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="submit-btn">Add Item</button>
        <button type="button" class="btn-secondary" onclick="cancelEdit()">Cancel</button>
      </div>
    </form>

    <!-- Search & Filter -->
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by name or SKU..." oninput="filterItems()" />
      <select id="filter-category" onchange="filterItems()">
        <option value="">All Categories</option>
        <option>Electronics</option>
        <option>Office Supplies</option>
        <option>Furniture</option>
        <option>Tools</option>
        <option>Clothing</option>
        <option>Food & Beverage</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Items Table -->
    <div class="table-wrapper">
      <table id="items-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>SKU</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Value</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="items-body">
          <tr id="empty-row">
            <td colspan="8" class="empty-msg">No items yet. Click "+ Add Item" to get started.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
